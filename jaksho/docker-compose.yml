version: '3.8'

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_DATABASE: "${DB_NAME}"
    volumes:
      - db-data:/var/lib/mysql
      - ./jaksho-generator/src/main/resources/sql:/sql:ro
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${DB_PASSWORD}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: jaksho/docker/backend.Dockerfile
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      SPRING_DATASOURCE_URL: "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useInformationSchema=true"
      SPRING_DATASOURCE_USERNAME: "${DB_USER}"
    ports:
      - "${BACKEND_PORT}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  db-data:
